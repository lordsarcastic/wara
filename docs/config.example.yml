# Optional local backend configuration.
# Place this at ~/.wara/config.yml when running Wara outside the Docker
# deployment, or set WARA_CONFIG_FILE to point at a different file.
# Environment variables override these values.

app_env: development
bind_addr: 0.0.0.0:8080
backend_port: 8080
frontend_port: 4200
secret_key: replace-with-a-long-random-secret
# Schema is applied by `wara-migrate migration apply`. Set db_push_schema only for
# local model iteration; it lets Toasty regenerate the schema directly.
db_push_schema: false
docs_enabled: true
remote_services_root: /opt/wara/services
dockerfile_context_dir: context
jwt_private_key_pem: |
  -----BEGIN RSA PRIVATE KEY-----
  replace-with-your-private-key
  -----END RSA PRIVATE KEY-----
jwt_public_key_pem: |
  -----BEGIN PUBLIC KEY-----
  replace-with-your-public-key
  -----END PUBLIC KEY-----
jwt_issuer: wara
jwt_audience: wara-api
jwt_access_token_ttl_seconds: 900
app_base_url: http://localhost:4200
invite_token_ttl_seconds: 604800
bootstrap_admin_email: admin@wara.local
bootstrap_admin_password: change-me
bootstrap_admin_name: Wara Admin

postgres_user: wara
postgres_password: wara
postgres_db: wara
postgres_port: 5432
database_url: postgres://wara:wara@localhost:5432/wara

telemetry_enabled: false
otel_service_name: wara-backend
otel_exporter_otlp_endpoint: http://localhost:4317

temporal_address: localhost:7233
temporal_namespace: default
temporal_namespaces: default
temporal_version: 1.30.1
temporal_ui_version: 2.34.0
temporal_postgresql_version: "16"
temporal_postgres_user: temporal
temporal_postgres_password: temporal
temporal_postgres_port: 5432
temporal_frontend_port: 7233
temporal_ui_port: 8081
temporal_ui_cors_origins: http://localhost:4200,http://localhost:8080

prometheus_port: 9090
jaeger_ui_port: 16686
jaeger_grpc_port: 4317
jaeger_http_port: 4318
elastic_username: elastic
elastic_password: changeme
elastic_port: 9200
grafana_port: 3000
grafana_admin_user: admin
grafana_admin_password: admin

# Tests only
test_database_url: postgres://wara:wara@localhost:5432/wara
