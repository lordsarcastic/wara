[package]
name = "wara-backend"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[[bin]]
name = "wara-backend"
path = "src/main.rs"

[[bin]]
name = "temporal_worker"
path = "src/bin/temporal_worker.rs"

[[bin]]
name = "wara-migrate"
path = "src/bin/migrate.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
http = "1"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "trace"] }
prometheus = "0.13"
rand = "0.8"
rsa = "0.9.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_neo = "0.11"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toasty = { version = "0.7.0", features = ["postgresql", "serde"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util"] }
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "preserve_order"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
axum-valid = "0.24.0"
validator = { version = "0.20.0", features = ["derive"] }
argon2 = "0.5.3"
# `rust_crypto` selects the pure-Rust crypto provider (no C toolchain dependency)
# and pulls in RSA support for RS256. The `rsa` name alone is only the optional
# dependency, not a complete provider, which leaves jsonwebtoken without a
# CryptoProvider at runtime.
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
# Drives the `wara-migrate` binary: Toasty's first-class migration system
# (Toasty.toml + generate/apply/snapshot over the registered models).
toasty-cli = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-postgres = "0.7.17"
